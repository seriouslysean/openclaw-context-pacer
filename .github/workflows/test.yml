name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16

      - name: tests
        run: npm test

      # The SDK is a peer the host gateway supplies, so it is installed here only, at the version package.json declares.
      - name: typecheck
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund typescript@7.0.2 @types/node@24.19.1 openclaw@2026.10.3
          npx --no-install tsc -p tsconfig.json
