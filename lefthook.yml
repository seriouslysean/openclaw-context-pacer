# Runs the checks CI runs before a push. Enable it once per clone with `lefthook install`.
# git exports repo-local variables such as GIT_DIR to a hook; from a linked worktree they point tools at the wrong repository.
pre-push:
  commands:
    ci:
      run: |
        unset $(git rev-parse --local-env-vars)
        npm run lint && npm run typecheck && npm test && npm run build && git diff --exit-code -- dist && test -z "$(git ls-files --others --exclude-standard -- dist)"
