name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.16

      # The gateway supplies the SDK at run time; the typecheck and the entry tests import the pinned devDependency.
      - name: install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: lint
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      - name: tests
        run: npm test
